name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: fantasy
          POSTGRES_DB: fantasy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fantasy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgresql://fantasy:fantasy@localhost:5432/fantasy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # publishes no major tag
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra aws
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations build the models' schema on Postgres
        env:
          FH_DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (SQLite, plus tests/test_postgres.py on Postgres)
        env:
          FH_TEST_POSTGRES_URL: ${{ env.POSTGRES_URL }}
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - name: Validate both stacks
        run: |
          for dir in bootstrap .; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  image:
    # Builds both Lambda images. The API image is a web server (the Lambda Web Adapter only runs
    # on Lambda), so it's checked over plain HTTP; the ingest image is only built, which imports it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          target: api
          platforms: linux/amd64
          provenance: false
          load: true
          tags: fantasy-helper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: backend
          target: ingest
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
      - name: Smoke test /api/health and /api/health/stream
        run: |
          docker run -d --name api -p 8080:8080 fantasy-helper:ci
          trap 'docker logs api' EXIT
          # Until the server is listening, Docker's port forward resets the connection, which
          # curl only retries with --retry-all-errors.
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors localhost:8080/api/health
          # Outside Lambda nothing buffers the response: the 4 events are 0.5 s apart, so the
          # first must arrive well before the last.
          curl --fail --silent --show-error --no-buffer localhost:8080/api/health/stream \
            | while read -r line; do [ -n "$line" ] && echo "$(date +%s.%N) $line"; done > events.txt
          cat events.txt
          [ "$(wc -l < events.txt)" -eq 4 ]
          awk 'NR == 1 { first = $1 } END { exit !($1 - first > 1) }' events.txt
