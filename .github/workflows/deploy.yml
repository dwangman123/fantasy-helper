name: Deploy

# Started by hand (Actions > Deploy > Run workflow, on main) once CI is green. To deploy on
# every push to main instead, add `push: {branches: [main]}` here.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # GitHub OIDC -> the deploy role from infra/terraform/bootstrap
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT: fantasy-helper

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          provenance: false # Lambda rejects image indexes with attestations
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Migrate the database
        working-directory: backend
        env:
          FH_SECRET_ID: ${{ env.PROJECT }}/app # the app's own settings source reads the database URL
        run: uv sync --frozen --extra aws && uv run alembic upgrade head

      - name: Move the functions to the new image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}@${{ steps.build.outputs.digest }}
        run: |
          for fn in "$PROJECT-api" "$PROJECT-ingest"; do
            if ! aws lambda get-function --function-name "$fn" > /dev/null 2>&1; then
              echo "::notice::$fn doesn't exist yet; the image is pushed, so run terraform apply in infra/terraform"
              continue
            fi
            aws lambda update-function-code --function-name "$fn" --image-uri "$IMAGE" > /dev/null
            aws lambda wait function-updated --function-name "$fn"
            echo "$fn -> $IMAGE"
          done

      - name: Smoke test
        run: |
          if ! url=$(aws lambda get-function-url-config --function-name "$PROJECT-api" --query FunctionUrl --output text 2> /dev/null); then
            echo "No API function yet"; exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "${url%/}/api/health"
