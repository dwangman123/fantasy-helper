name: Deploy

# Runs on its own once CI passes for a push to main, deploying the commit CI checked: the backend
# first, then the frontend, so the site never calls an API older than itself. (Vercel's own deploys
# of main are off in frontend/vercel.json; other branches still get preview deploys.) It can also
# be started by hand (Actions > Deploy > Run workflow, on main); the deploy role only trusts main,
# so a run from any other branch can't get AWS credentials.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # GitHub OIDC -> the deploy role from infra/terraform/bootstrap
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT: fantasy-helper

jobs:
  newest:
    # Only a green CI run for a push deploys. CI runs can also finish out of order, so only the
    # newest commit on main deploys: an older one never replaces it. A run by hand deploys main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main" = "$SHA" ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $main, which deploys once its CI passes; skipping $SHA"
          fi

  deploy:
    needs: newest
    if: needs.newest.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.newest.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      # One Dockerfile, two targets that share every layer but the last: the API as a web server
      # behind the Lambda Web Adapter, and the ingest as a plain handler. The moving `api` and
      # `ingest` tags are what Terraform's first apply looks up.
      - id: build-api
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: api
          platforms: linux/amd64
          provenance: false # Lambda rejects image indexes with attestations
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}:${{ needs.newest.outputs.sha }}-api
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}:api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: build-ingest
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: ingest
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}:${{ needs.newest.outputs.sha }}-ingest
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}:ingest
          cache-from: type=gha

      - uses: astral-sh/setup-uv@v10.3.0 # publishes no major tag
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Migrate the database
        working-directory: backend
        env:
          FH_SECRET_ID: ${{ env.PROJECT }}/app # the app's own settings source reads the database URL
        run: uv sync --frozen --extra aws && uv run alembic upgrade head

      - name: Move the functions to the new images
        id: move
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          INGEST_DIGEST: ${{ steps.build-ingest.outputs.digest }}
        run: |
          move() { # function name, image digest, output name for the image it ran before
            if ! previous=$(aws lambda get-function --function-name "$1" --query Code.ImageUri --output text 2> /dev/null); then
              echo "::notice::$1 doesn't exist yet; the image is pushed, so run terraform apply in infra/terraform"
              return
            fi
            echo "$3=$previous" >> "$GITHUB_OUTPUT"
            aws lambda update-function-code --function-name "$1" --image-uri "$REPO@$2" > /dev/null
            aws lambda wait function-updated --function-name "$1"
            echo "$1 -> $REPO@$2 (was $previous)"
          }
          move "$PROJECT-api" "$API_DIGEST" previous_api
          move "$PROJECT-ingest" "$INGEST_DIGEST" previous_ingest

      - name: Smoke test
        id: smoke
        run: |
          if ! url=$(aws lambda get-function-url-config --function-name "$PROJECT-api" --query FunctionUrl --output text 2> /dev/null); then
            echo "No API function yet"; exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "${url%/}/api/health"
          # Every event must arrive, 0.5 s apart when the function URL streams (api_streaming in
          # infra/terraform): then the first must come well before the last.
          curl --fail --silent --show-error --no-buffer "${url%/}/api/health/stream" \
            | while read -r line; do if [ -n "$line" ]; then echo "$(date +%s.%N) $line"; fi; done > events.txt
          cat events.txt
          [ "$(grep -c ' data: ' events.txt)" -eq 4 ]
          mode=$(aws lambda get-function-url-config --function-name "$PROJECT-api" --query InvokeMode --output text)
          echo "Function URL invoke mode: $mode"
          if [ "$mode" = "RESPONSE_STREAM" ]; then
            awk 'NR == 1 { first = $1 } END { exit !($1 - first > 1) }' events.txt
          fi

      - name: Roll back if the smoke test failed
        if: failure() && steps.smoke.conclusion == 'failure'
        env:
          PREVIOUS_API: ${{ steps.move.outputs.previous_api }}
          PREVIOUS_INGEST: ${{ steps.move.outputs.previous_ingest }}
        run: |
          back() {
            [ -n "$2" ] || return 0
            aws lambda update-function-code --function-name "$1" --image-uri "$2" > /dev/null
            aws lambda wait function-updated --function-name "$1"
            echo "::warning::$1 rolled back to $2"
          }
          back "$PROJECT-api" "$PREVIOUS_API"
          back "$PROJECT-ingest" "$PREVIOUS_INGEST"

  frontend:
    # Only once the backend is live. Builds with the production settings and env vars from Vercel
    # (API_URL among them, which Next.js bakes in at build time) and publishes to production.
    needs: [newest, deploy]
    runs-on: ubuntu-latest
    env:
      VERCEL: npx --yes vercel@65.4.0
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.newest.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # the Vercel project's Node.js version, which its own builds used
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and deploy to production
        run: |
          $VERCEL pull --yes --environment=production --token="$VERCEL_TOKEN"
          $VERCEL build --prod --token="$VERCEL_TOKEN"
          $VERCEL deploy --prebuilt --prod --token="$VERCEL_TOKEN"
