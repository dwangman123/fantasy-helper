[project]
name = "fantasy-helper"
version = "0.1.0"
description = "Analytics and an AI assistant for an ESPN 9-cat H2H NBA fantasy league"
readme = "../README.md"
authors = [
    { name = "dennis", email = "dennis.wangdot@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "espn-api>=1.0.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
fh-ingest = "fantasy_helper.ingest.run:main"
fh-predict = "fantasy_helper.predict:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
